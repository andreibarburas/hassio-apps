configuration:
  app_url:
    name: Application URL
    description: >-
      The full public URL where Solidtime will be accessible, e.g.
      https://solidtime.yourdomain.com or http://homeassistant.local:8000.
      Must match what you expose via Nginx Proxy Manager.
  app_key:
    name: App Key
    description: >-
      Laravel application key. Generate with:
      docker run --rm solidtime/solidtime:latest php artisan self-host:generate-keys
      Copy the APP_KEY value (starts with base64:).
  passport_private_key:
    name: Passport Private Key
    description: >-
      OAuth private key. Generated by the same self-host:generate-keys command above.
  passport_public_key:
    name: Passport Public Key
    description: >-
      OAuth public key. Generated by the same self-host:generate-keys command above.
  db_password:
    name: Database Password
    description: Password for the internal PostgreSQL database user.
  db_database:
    name: Database Name
    description: PostgreSQL database name (default: solidtime).
  db_username:
    name: Database Username
    description: PostgreSQL username (default: solidtime).
  super_admins:
    name: Super Admin Email(s)
    description: >-
      Comma-separated list of email addresses that should have super admin access.
      E.g. you@example.com
  app_enable_registration:
    name: Enable Registration
    description: Allow new users to register via the web UI.
  mail_mailer:
    name: Mail Driver
    description: >-
      Use "log" to skip real email (activation links appear in addon logs).
      Use "smtp" for real email delivery.
  mail_host:
    name: SMTP Host
    description: SMTP server hostname. Required when Mail Driver is smtp.
  mail_port:
    name: SMTP Port
    description: SMTP port (usually 587 for TLS or 465 for SSL).
  mail_username:
    name: SMTP Username
    description: SMTP account username.
  mail_password:
    name: SMTP Password
    description: SMTP account password.
  mail_from_address:
    name: Mail From Address
    description: The sender email address for outgoing mail.
  mail_from_name:
    name: Mail From Name
    description: The sender display name for outgoing mail.
  auto_db_migrate:
    name: Auto-migrate Database
    description: >-
      Run database migrations automatically on startup. Recommended to leave on.
      Safe to run repeatedly.
  trusted_hosts:
    name: Trusted Hosts
    description: >-
      Comma-separated list of additional hostnames that Solidtime should accept
      requests from (added in Solidtime 0.19.0). Leave empty if you only access
      Solidtime via the APP_URL hostname. Supports wildcards e.g. *.example.com.
      Example: solidtime.local,solidtime.tailnet-name.ts.net
