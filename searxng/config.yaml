version: "2026.6.15-2"
slug: searxng
init: false
homeassistant_api: false
hassio_api: false

url: "https://github.com/andreibarburas/hassio-apps"
webui: "http://[HOST]:[PORT:6789]"

ports:
  6789/tcp: 6789

ports_description:
  6789/tcp: SearXNG Web UI

arch:
  - aarch64
  - amd64

map:
  - data:rw

options: {}
schema: {}
