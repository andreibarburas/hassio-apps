configuration:
  server_name:
    name: Server name
    description: Display name for your music server (e.g. "My Navidrome").
  server_type:
    name: Server type
    description: >
      The type of music server to connect to.
      Leave empty to let the user choose on first launch.
  server_url:
    name: Server URL
    description: >
      Full URL to your music server, including protocol and port
      (e.g. http://192.168.1.10:4533 or https://navidrome.example.com).
  server_lock:
    name: Lock server settings
    description: >
      When enabled (and server name, type, and URL are all set),
      users can only enter their username and password — they cannot change
      the server connection details.
  analytics_disabled:
    name: Disable analytics
    description: >
      Disable Umami analytics tracking in the web interface.
      Recommended to keep enabled (true) for privacy.
