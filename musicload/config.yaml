name: Musicload
version: "1.7"
slug: musicload
description: Self-hosted Navidrome companion for searching, previewing and downloading music
url: https://github.com/kingdaniel4747/musicload
webui: "http://[HOST]:[PORT:8420]"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
hassio_api: false
ports:
  8000/tcp: 8420
ports_description:
  8000/tcp: Musicload web interface
map:
  - type: media
    read_only: false
options:
  music_library_path: "music"
schema:
  music_library_path: str
